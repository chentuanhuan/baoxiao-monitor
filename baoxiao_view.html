<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>报销核对监控 · 只读快照</title>
<style>
  :root{
    --bg:#f4f6fb; --card:#ffffff; --line:#e7ebf3; --text:#1c2333; --muted:#7a8499;
    --primary:#3b6ef5; --primary-soft:#eaf0ff; --red:#e5484d; --red-soft:#fdebec;
    --green:#18a058; --green-soft:#e6f7ee; --amber:#e8871e; --amber-soft:#fdf3e4;
    --radius:16px; --shadow:0 1px 2px rgba(20,30,60,.05), 0 6px 24px rgba(20,30,60,.06);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",Roboto,sans-serif;
    background:var(--bg);color:var(--text);line-height:1.6;padding-bottom:env(safe-area-inset-bottom);-webkit-font-smoothing:antialiased}
  .wrap{max-width:1080px;margin:0 auto;padding:20px 16px 60px}

  header{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:20px}
  .brand{display:flex;align-items:center;gap:12px}
  .brand .logo{width:46px;height:46px;border-radius:13px;background:linear-gradient(135deg,#3b6ef5,#6a5cf5);display:flex;align-items:center;justify-content:center;flex:0 0 auto}
  .brand h1{font-size:20px;font-weight:700;letter-spacing:.5px}
  .brand p{font-size:12.5px;color:var(--muted);margin-top:2px}
  .head-right{display:flex;flex-direction:column;align-items:flex-end;gap:8px}
  .meta{font-size:12.5px;color:var(--muted)}

  .btn{display:inline-flex;align-items:center;gap:7px;font-size:13.5px;font-weight:600;color:#fff;background:var(--primary);border:none;border-radius:10px;padding:9px 16px;cursor:pointer;font-family:inherit}
  .btn:hover{filter:brightness(1.05)}
  .btn:disabled{opacity:.6;cursor:default}
  .btn.ghost{color:var(--text);background:#fff;border:1px solid var(--line)}
  .btn.ghost:hover{background:#f5f7fc}
  .run-tip{font-size:12px;color:var(--amber);max-width:380px;text-align:right}

  .grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-bottom:18px}
  .kpi{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:15px 18px;box-shadow:var(--shadow)}
  .kpi .k{font-size:13px;color:var(--muted);margin-bottom:5px}
  .kpi .v{font-size:27px;font-weight:700;letter-spacing:.5px}
  .kpi.danger .v{color:var(--red)}
  .kpi.warn .v{color:var(--amber)}
  .kpi.ok .v{color:var(--green)}
  .kpi .s{font-size:11.5px;color:var(--muted);margin-top:2px}

  .banner{display:flex;align-items:flex-start;gap:10px;background:var(--primary-soft);border:1px solid #d6e0ff;border-radius:12px;padding:12px 16px;font-size:13px;color:#33508f;margin-bottom:16px}
  .banner svg{flex:0 0 auto;margin-top:2px}

  .card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);margin-bottom:18px;overflow:hidden}
  .card-h{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:15px 20px;border-bottom:1px solid var(--line)}
  .card-h h2{font-size:16px;font-weight:700;display:flex;align-items:center;gap:8px}
  .badge{font-size:12px;font-weight:600;color:var(--red);background:var(--red-soft);border-radius:999px;padding:2px 10px}
  .badge.zero{color:var(--green);background:var(--green-soft)}
  .card-b{padding:16px 20px}

  .group{border:1px solid #f6c7c9;background:var(--red-soft);border-radius:12px;padding:16px;margin-bottom:14px}
  .group:last-child{margin-bottom:0}
  .group-h{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:4px}
  .group-h .t{font-weight:700;font-size:15px}
  .fieldtag{font-size:11.5px;font-weight:600;background:#fff;border:1px solid #f0c4c6;color:#b34045;border-radius:6px;padding:2px 8px}
  .group .v{font-size:13px;color:#8c3a3d;word-break:break-all;margin:4px 0 12px}
  .rec{display:flex;align-items:center;gap:12px;background:#fff;border:1px solid #f2d2d4;border-radius:10px;padding:10px 12px;margin-bottom:8px;flex-wrap:wrap}
  .rec:last-child{margin-bottom:0}
  .rec .info{flex:1;min-width:200px;font-size:13px}
  .rec .info .row{display:flex;gap:14px;flex-wrap:wrap;color:#5b6472}
  .rec .info .row span b{color:var(--text);font-weight:600}
  .st{display:inline-flex;align-items:center;font-size:12px;font-weight:600;border-radius:999px;padding:3px 10px;white-space:nowrap}
  .st.pending{color:var(--amber);background:var(--amber-soft)}
  .st.modified{color:var(--primary);background:var(--primary-soft)}
  .st.clean{color:var(--green);background:var(--green-soft)}
  .rec a{font-size:12.5px;color:var(--primary);background:var(--primary-soft);border-radius:8px;padding:6px 11px;text-decoration:none;font-weight:600;white-space:nowrap}
  .rec a:hover{background:var(--primary);color:#fff}
  .btn.small{padding:6px 12px;font-size:12.5px;border-radius:8px}
  .confirm-bar{margin-top:12px;padding-top:10px;border-top:1px dashed #f0c4c6;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  .confirm-hint{font-size:12.5px;color:#8c3a3d;font-weight:600}
  .confirm-bar .st{font-size:12px}

  .empty{text-align:center;padding:34px 20px;color:var(--muted)}
  .empty .ok-ico{width:52px;height:52px;border-radius:50%;background:var(--green-soft);display:inline-flex;align-items:center;justify-content:center;margin-bottom:12px}

  table{width:100%;border-collapse:collapse;font-size:13.5px}
  thead th{text-align:left;font-size:12px;color:var(--muted);font-weight:600;padding:9px 10px;border-bottom:1px solid var(--line);background:#fafbfe}
  tbody td{padding:10px;border-bottom:1px solid #f1f4f9}
  tbody tr:last-child td{border-bottom:none}
  .table-name{font-weight:600}
  .group-tag{font-size:11px;color:var(--primary);background:var(--primary-soft);border-radius:6px;padding:2px 7px;font-weight:600}
  .num{font-variant-numeric:tabular-nums}

  .note{font-size:12.5px;color:var(--muted);background:#fbfcff;border:1px dashed var(--line);border-radius:12px;padding:14px 16px;line-height:1.8}
  .note b{color:var(--text)}
  input[type=file]{display:none}

  @media (max-width:768px){
    .grid{grid-template-columns:repeat(2,1fr)}
    .kpi .v{font-size:23px}
    thead th:nth-child(2),tbody td:nth-child(2){display:none}
    header{flex-direction:column;align-items:flex-start}
    .head-right{align-items:flex-start}
    .run-tip{text-align:left}
    .rec .info .row{flex-direction:column;gap:2px}
  }
</style>
</head>

    <span>以下为<b>机器筛选出的疑似重复</b>，仅供各助理参考，不作最终判定。确认真实情况请到飞书表核对。</span>
  </div>

  <div class="card">
    <div class="card-h"><h2>疑似重复 · 待人工核查</h2><span class="badge" id="dupBadge">0</span></div>
    <div class="card-b" id="dupList"></div>
  </div>

  

  <div class="card">
    <div class="card-h"><h2>监控清单</h2><span style="font-size:12px;color:var(--muted)" id="scopeText"></span></div>
    <div class="card-b" style="padding:0">
      <div style="overflow-x:auto">
        <table>
          <thead><tr><th>子表</th><th>所属</th><th>记录</th><th>待排查</th><th>已修改</th><th>未重复</th><th>疑似组</th></tr></thead>
          <tbody id="tableList"></tbody>
        </table>
      </div>
    </div>
  </div>

  <div class="note" id="ruleNote"></div>
</div>

function esc(s){ return String(s==null?'':s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];}); }
function num(v){ return (v==null||v==='') ? '--' : v; }
function statusPill(st){
  st = st || '待排查';
  var cls = st==='未重复' ? 'clean' : (st==='已修改' ? 'modified' : 'pending');
  return '<span class="st '+cls+'">'+esc(st)+'</span>';
}

function renderAll(data){
  if(!data || !data.summary){ return; }
  var s = data.summary || {};
  var mode = data.mode === 'manual' ? '手动排查' : '定时排查';
  document.getElementById('syncMeta').textContent = '数据更新时间：' + (data.generated_at||'--') + ' · ' + mode;

  document.getElementById('kTables').textContent = num(s.total_tables);
  document.getElementById('kChecked').textContent = num(s.total_tables);
  document.getElementById('kSkipped').textContent = num(s.skipped_tables);
  document.getElementById('kRecords').textContent = num(s.total_records);
  document.getElementById('kPending').textContent = num(s.pending_count);
  document.getElementById('kModified').textContent = num(s.modified_count);
  document.getElementById('kExclude').textContent = num(s.exclude_count);
  document.getElementById('kGroups').textContent = num(s.suspect_groups);

  var html = '';
  var totalGroups = 0;
  (data.suspects||[]).forEach(function(t){
    (t.groups||[]).forEach(function(g){
      totalGroups++;
      var recs = (g.records||[]).map(function(r){
        var rows = [];
        if(r.table_name) rows.push('<span style="color:var(--muted)">'+esc(r.table_name)+'</span>');
        if(r.merchant) rows.push('<span>单号 <b>'+esc(r.merchant)+'</b></span>');
        if(r.amount) rows.push('<span>金额 <b>'+esc(r.amount)+'</b></span>');
        if(r.handler) rows.push('<span>经手 <b>'+esc(r.handler)+'</b></span>');
        if(r.date) rows.push('<span>日期 <b>'+esc(r.date)+'</b></span>');
        var link = r.link ? '<a href="'+esc(r.link)+'" target="_blank" rel="noopener">打开记录</a>' : '';
        return '<div class="rec"><div class="info"><div class="row">'+rows.join('')+'</div></div>'
          + '<div>'+statusPill(r.status)+'</div>'+link+'</div>';
      }).join('');
      html += '<div class="group">'
        + '<div class="group-h"><span class="t">'+esc(t.base_name)+'</span>'
        + '<span class="fieldtag">'+esc(g.field)+'</span>'
        + '<span class="fieldtag">'+g.record_count+' 条记录</span></div>'
        + '<div class="v">'+ (g.field==='商户单号' ? '商户单号：' : '文件：') + esc(g.value) +'</div>'
        + recs + '</div>';
    });
  });
  if(!html){
    html = '<div class="empty"><div class="ok-ico"><svg width="26" height="26" viewBox="0 0 24 24" fill="none"><path d="M4 12.5l5 5L20 6.5" stroke="#18a058" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg></div><div>当前没有待核查的疑似重复，一切正常</div></div>';
  }
  document.getElementById('dupList').innerHTML = html;
  var badge = document.getElementById('dupBadge');
  badge.textContent = totalGroups;
  badge.className = 'badge' + (totalGroups===0 ? ' zero' : '');

  

  var listHtml = '';
  var checkedCount = 0, skippedCount = 0;
  (data.checked_tables||[]).forEach(function(c){ if(c.status==='checked') checkedCount++; else skippedCount++; });
  (data.checked_tables||[]).forEach(function(c){
    var skipped = c.status==='skipped_date';
    listHtml += '<tr><td class="table-name">'+esc(c.table_name)+'</td>'
      + '<td><span class="group-tag">'+esc(c.base_name)+'</span></td>'
      + '<td class="num">'+(c.records_count!=null?c.records_count:'--')+'</td>'
      + '<td class="num">'+(skipped?'—':(c.pending_count!=null?c.pending_count:'--'))+'</td>'
      + '<td class="num">'+(skipped?'—':(c.modified_count!=null?c.modified_count:'--'))+'</td>'
      + '<td class="num">'+(skipped?'—':(c.exclude_count!=null?c.exclude_count:'--'))+'</td>'
      + '<td>'+(skipped ? '<span class="group-tag" style="color:var(--muted);background:#eef1f7">非排查日</span>' : '<span class="num">'+(c.suspect_groups!=null?c.suspect_groups:0)+'</span>')+'</td></tr>';
  });
  document.getElementById('tableList').innerHTML = listHtml;
  document.getElementById('scopeText').textContent = '本次排查 ' + checkedCount + ' 张 / 跳过 ' + skippedCount + ' 张';

  document.getElementById('ruleNote').innerHTML =
    '<b>查重规则：</b>同一张多维表内各子表互相查重（跨子表）；分公司↔总部（不同表）之间不查重；汇总表不参与。<br>'+
    '<b>人工核查：</b>机器只做筛选，把疑似重复组列出来供核对；核对结果由管理员在工作台点「已修改/未重复」确认，确认过的记录下次排查自动排除、不再提示。<br>'+
    '<b>已通过改动：</b>已标记「已通过」的记录若字段内容被改动，会在此列出，需复核。<br>'+
    '<b>定时排查：</b>分公司表每月 1/15/20 号、总部表每天 15:05。本页数据随后台排查自动更新。';
}

renderAll(EMBEDDED);
</script>
</body>
</html>
